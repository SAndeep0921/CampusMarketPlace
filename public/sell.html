<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sell Item - Campus Marketplace</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- ================= NAVBAR ================= -->

    <header class="modern-header">

        <nav class="modern-navbar">

            <a href="index.html" class="brand">

                <div class="brand-icon">
                    🎓
                </div>

                <div class="brand-text">

                    <div class="brand-name">
                        Campus<span>Market</span>
                    </div>

                    <div class="brand-tagline">
                        Buy · Sell · Connect
                    </div>

                </div>

            </a>


            <div class="modern-nav-links">

                <a href="index.html">
                    Home
                </a>

                <a href="index.html#products">
                    Browse
                </a>

                <a href="sell.html" class="active">
                    Sell
                </a>

                <a href="index.html#about">
                    About
                </a>

            </div>


            <div class="nav-actions">

                <button
                    class="nav-search-button"
                    onclick="window.location.href='index.html#products'"
                >
                    🔍
                </button>

                <a
                    href="login.html"
                    class="login-button"
                    id="navLoginButton"
                >
                    Login
                </a>

                <a
                    href="register.html"
                    class="register-button"
                    id="navRegisterButton"
                >
                    Register
                </a>

                <div
                    id="userMenu"
                    style="display: none;"
                >

                    <span id="userName"></span>

                    <button id="logoutButton">
                        Logout
                    </button>

                </div>

            </div>

        </nav>

    </header>


    <!-- ================= SELL SECTION ================= -->

    <section class="register-section">

        <div class="register-card">

            <!-- HEADER -->

            <div class="register-header">

                <h1>
                    Sell Your Item
                </h1>

                <p>
                    List your item and connect with students on your campus.
                </p>

            </div>


            <!-- SELL FORM -->

            <form id="sellForm">


                <!-- PRODUCT NAME -->

                <div class="form-group">

                    <label for="productName">
                        Product Name
                    </label>

                    <input
                        type="text"
                        id="productName"
                        name="productName"
                        placeholder="Example: Engineering Mathematics Book"
                        required
                    >

                </div>


                <!-- CATEGORY -->

                <div class="form-group">

                    <label for="category">
                        Category
                    </label>

                    <select
                        id="category"
                        name="category"
                        required
                    >

                        <option value="">
                            Select Category
                        </option>

                        <option value="Books">
                            Books & Notes
                        </option>

                        <option value="Electronics">
                            Electronics
                        </option>

                        <option value="Clothes">
                            Clothes & Fashion
                        </option>

                        <option value="Furniture">
                            Furniture
                        </option>

                        <option value="Mobile Phones">
                            Mobile Phones
                        </option>

                        <option value="Hostel Essentials">
                            Hostel Essentials
                        </option>

                        <option value="Sports">
                            Sports & Fitness
                        </option>

                        <option value="Others">
                            Others
                        </option>

                    </select>

                </div>


                <!-- PRODUCT IMAGE -->

                <div class="form-group">

                    <label for="productImage">
                        Product Image
                    </label>

                    <div class="image-upload">

                        <input
                            type="file"
                            id="productImage"
                            name="productImage"
                            accept="image/*"
                        >

                        <p>
                            Select a clear image of your product
                        </p>

                        <img
                            id="imagePreview"
                            class="image-preview"
                            alt="Product Preview"
                        >

                    </div>

                </div>


                <!-- PRICE -->

                <div class="form-group">

                    <label for="price">
                        Price
                    </label>

                    <input
                        type="number"
                        id="price"
                        name="price"
                        placeholder="Enter price in ₹"
                        min="0"
                        required
                    >

                </div>


                <!-- DESCRIPTION -->

                <div class="form-group">

                    <label for="description">
                        Description
                    </label>

                    <textarea
                        id="description"
                        name="description"
                        placeholder="Describe the condition, features, age, etc."
                        required
                    ></textarea>

                </div>


                <!-- SELLER NAME -->

                <div class="form-group">

                    <label for="sellerName">
                        Your Name
                    </label>

                    <input
                        type="text"
                        id="sellerName"
                        name="sellerName"
                        placeholder="Enter your full name"
                        required
                    >

                </div>


                <!-- CONTACT -->

                <div class="form-group">

                    <label for="contact">
                        Contact Number
                    </label>

                    <input
                        type="tel"
                        id="contact"
                        name="contact"
                        placeholder="Enter 10 digit mobile number"
                        maxlength="10"
                        required
                    >

                </div>


                <!-- EMAIL -->

                <div class="form-group">

                    <label for="email">
                        Email ID
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="example@gmail.com"
                        required
                    >

                </div>


                <!-- MESSAGE -->

                <p
                    id="sellMessage"
                    style="text-align:center; margin:15px 0;"
                ></p>


                <!-- SUBMIT -->

                <button type="submit">
                    📦 Post Item
                </button>


            </form>

        </div>

    </section>


    <!-- ================= FOOTER ================= -->

    <footer class="modern-footer">

        <div class="footer-logo">
            🎓 CampusMarket
        </div>

        <p>
            A student-to-student marketplace.
        </p>

        <p>
            © 2026 Campus Marketplace
        </p>

    </footer>


    <!-- JAVASCRIPT -->

    <script src="script.js"></script>


    <!-- LOGIN PROTECTION -->

    <script>

        const loggedInUser =
            localStorage.getItem("loggedInUser");

        if (!loggedInUser) {

            alert(
                "Please login before selling an item."
            );

            window.location.href =
                "login.html";

        }

    </script>

</body>

</html>
