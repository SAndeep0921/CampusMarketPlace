<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Register - CampusMarket</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Navbar -->
    <nav class="navbar">
        <div class="nav-container">

            <a href="index.html" class="logo">
                Campus<span>Market</span>
            </a>

            <div class="nav-links">
                <a href="index.html">Buy</a>
                <a href="sell.html">Sell</a>
                <a href="register.html" class="active">Register</a>
            </div>

        </div>
    </nav>


    <!-- Registration Section -->
    <section class="register-section">

        <div class="register-card">

            <div class="register-header">
                <h1>Create Account</h1>
                <p>Join CampusMarket and start buying and selling with students.</p>
            </div>


            <form id="registerForm">

                <!-- Name -->
                <div class="form-group">
                    <label for="name">Full Name</label>

                    <input
                        type="text"
                        id="name"
                        placeholder="Enter your full name"
                        required
                    >
                </div>


                <!-- Email -->
                <div class="form-group">
                    <label for="email">Email Address</label>

                    <input
                        type="email"
                        id="email"
                        placeholder="example@gmail.com"
                        required
                    >
                </div>


                <!-- Password -->
                <div class="form-group">
                    <label for="password">Password</label>

                    <input
                        type="password"
                        id="password"
                        placeholder="Enter your password"
                        minlength="6"
                        required
                    >
                </div>


                <!-- Confirm Password -->
                <div class="form-group">
                    <label for="confirmPassword">Confirm Password</label>

                    <input
                        type="password"
                        id="confirmPassword"
                        placeholder="Re-enter your password"
                        minlength="6"
                        required
                    >
                </div>


                <button type="submit" class="register-button">
                    Create Account
                </button>

            </form>


            <p id="registerMessage" class="register-message"></p>


            <div class="login-link">
                Already have an account?
                <a href="login.html">Login</a>
            </div>

        </div>

    </section>


    <!-- Footer -->
    <footer class="footer">

        <p>
            © 2026 CampusMarket. Built for students.
        </p>

    </footer>


    <script src="script.js"></script>

</body>
</html>
